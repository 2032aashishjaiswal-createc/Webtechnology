<!DOCTYPE html>
<html>
<head>
    <title>MyShop - Register</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
        .success {
            color: green;
            font-size: 14px;
            margin-bottom: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 10px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> |
    <a href="products.html">Products</a> |
    <a href="login.html">Login</a> |
    <a href="register.html">Register</a>
</nav>

<h1>Register</h1>

<div id="successMessage" class="success" style="display:none;"></div>

<form id="registerForm" onsubmit="return validateRegisterForm(event)">
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <div id="usernameError" class="error"></div>
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <div id="emailError" class="error"></div>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <div id="phoneError" class="error"></div>
    </div>

    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <div id="passwordError" class="error"></div>
    </div>

    <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword">
        <div id="confirmPasswordError" class="error"></div>
    </div>

    <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="login.html">Login here</a></p>

<script>
function validateRegisterForm(event) {
    event.preventDefault();
    
    // Clear previous errors
    clearErrors();
    
    let isValid = true;
    
    // Get form values
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    // Validate username
    if (username === '') {
        showError('usernameError', 'Username is required');
        isValid = false;
    } else if (username.length < 3) {
        showError('usernameError', 'Username must be at least 3 characters');
        isValid = false;
    } else if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        showError('usernameError', 'Username can only contain letters, numbers, and underscores');
        isValid = false;
    }
    
    // Validate email
    if (email === '') {
        showError('emailError', 'Email is required');
        isValid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('emailError', 'Please enter a valid email address');
        isValid = false;
    }
    
    // Validate phone
    if (phone === '') {
        showError('phoneError', 'Phone number is required');
        isValid = false;
    } else if (!/^[0-9]{10}$/.test(phone)) {
        showError('phoneError', 'Phone number must be 10 digits');
        isValid = false;
    }
    
    // Validate password
    if (password === '') {
        showError('passwordError', 'Password is required');
        isValid = false;
    } else if (password.length < 6) {
        showError('passwordError', 'Password must be at least 6 characters');
        isValid = false;
    } else if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])/.test(password)) {
        showError('passwordError', 'Password must contain uppercase, lowercase, and number');
        isValid = false;
    }
    
    // Validate confirm password
    if (confirmPassword === '') {
        showError('confirmPasswordError', 'Please confirm your password');
        isValid = false;
    } else if (password !== confirmPassword) {
        showError('confirmPasswordError', 'Passwords do not match');
        isValid = false;
    }
    
    if (isValid) {
        // Store user data in localStorage
        const userData = {
            username: username,
            email: email,
            phone: phone,
            password: password
        };
        localStorage.setItem('user_' + username, JSON.stringify(userData));
        
        // Show success message
        document.getElementById('successMessage').textContent = 'Registration successful! Redirecting to login...';
        document.getElementById('successMessage').style.display = 'block';
        
        // Redirect to login page after 2 seconds
        setTimeout(function() {
            window.location.href = 'login.html';
        }, 2000);
    }
    
    return false;
}

function showError(elementId, message) {
    document.getElementById(elementId).textContent = message;
}

function clearErrors() {
    const errorElements = document.getElementsByClassName('error');
    for (let i = 0; i < errorElements.length; i++) {
        errorElements[i].textContent = '';
    }
    document.getElementById('successMessage').style.display = 'none';
}
</script>

</body>
</html>
