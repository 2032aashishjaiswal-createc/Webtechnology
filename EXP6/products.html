<!DOCTYPE html>
<html>
<head>
    <title>MyShop - Products</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #333;
            padding: 10px;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin-right: 5px;
        }
        nav a:hover {
            background-color: #555;
        }
        .user-info {
            float: right;
            color: white;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-card button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .product-card button:hover {
            background-color: #45a049;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body onload="checkLoginStatus()">

<header>
    <h1>Our Products</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="contact.html">Contact</a>
    <span class="user-info" id="userInfo"></span>
</nav>

<main>
    <div class="product-grid">
        <article class="product-card">
            <figure>
                <img src="https://via.placeholder.com/200" alt="Wireless Headphones">
                <figcaption><strong>Wireless Headphones</strong></figcaption>
            </figure>
            <p>High-quality sound and long battery life.</p>
            <p><strong>Price: $50</strong></p>
            <button onclick="addToCart('Wireless Headphones', 50)">Add to Cart</button>
        </article>

        <article class="product-card">
            <figure>
                <img src="https://via.placeholder.com/200" alt="Smart Watch">
                <figcaption><strong>Smart Watch</strong></figcaption>
            </figure>
            <p>Track your fitness and notifications easily.</p>
            <p><strong>Price: $80</strong></p>
            <button onclick="addToCart('Smart Watch', 80)">Add to Cart</button>
        </article>

        <article class="product-card">
            <figure>
                <img src="https://via.placeholder.com/200" alt="Bluetooth Speaker">
                <figcaption><strong>Bluetooth Speaker</strong></figcaption>
            </figure>
            <p>Portable speaker with amazing sound quality.</p>
            <p><strong>Price: $35</strong></p>
            <button onclick="addToCart('Bluetooth Speaker', 35)">Add to Cart</button>
        </article>

        <article class="product-card">
            <figure>
                <img src="https://via.placeholder.com/200" alt="Laptop Stand">
                <figcaption><strong>Laptop Stand</strong></figcaption>
            </figure>
            <p>Ergonomic stand for better posture.</p>
            <p><strong>Price: $25</strong></p>
            <button onclick="addToCart('Laptop Stand', 25)">Add to Cart</button>
        </article>
    </div>
</main>

<footer>
    <p>&copy; 2026 MyShop</p>
</footer>

<script>
function checkLoginStatus() {
    const loggedInUser = sessionStorage.getItem('loggedInUser');
    const userInfoDiv = document.getElementById('userInfo');
    
    if (loggedInUser) {
        userInfoDiv.innerHTML = 'Welcome, ' + loggedInUser + ' | <a href="#" onclick="logout()" style="color: white;">Logout</a>';
    } else {
        userInfoDiv.innerHTML = '<a href="login.html" style="color: white;">Login</a> | <a href="register.html" style="color: white;">Register</a>';
    }
}

function logout() {
    sessionStorage.clear();
    alert('Logged out successfully!');
    window.location.href = 'index.html';
}

function addToCart(productName, price) {
    // Get existing cart or create new one
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    
    // Check if product already exists in cart
    const existingProduct = cart.find(item => item.name === productName);
    
    if (existingProduct) {
        existingProduct.quantity += 1;
    } else {
        cart.push({
            name: productName,
            price: price,
            quantity: 1
        });
    }
    
    // Save cart to localStorage
    localStorage.setItem('cart', JSON.stringify(cart));
    
    alert(productName + ' added to cart!');
}
</script>

</body>
</html>
